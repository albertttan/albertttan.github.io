<html lang="en">
<head>

<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

<div id="loadingScreen"><div class="spinner"></div><div id="loadingText">Loading verbs-db &amp; nouns-db…</div></div>

<div class="container" style="max-width:640px; display:none;" id="appRoot">

    <!-- VERBS -->

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2 filebar">
        <div class="muted small" id="verbCount">—</div>
        <div class="d-flex gap-2">

            <ul class="dropdown-menu p-2" id="tenseFilterMenu">

    <!-- ADJ & NOUNS -->

            <button class="btn btn-sm btn-outline-ink dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside">Cases</button>

          <label class="btn btn-sm btn-outline-ink mb-0">Load adjektive.json<input type="file" id="adjFile" accept=".json" hidden></label>

      <div class="card-quiz p-4 mb-3">
        <div class="d-flex gap-2 mb-3 flex-wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
<script>var GV = (function(){


const auxHaben = {
    hasPrefix: false,
    PA2: ['gehabt'],
    KJ1: { S: { '1': 'habe', '2': 'habest', '3': 'habe' }, P: { '1': 'haben', '2': 'habet', '3': 'haben' } },
    PRÄ: { S: { '1': 'habe', '2': 'hast', '3': 'hat' }, P: { '1': 'haben', '2': 'habt', '3': 'haben' } },
    IMP: { S: 'habe', P: 'habt' },
    INF: 'haben',
    PA1: 'habend',
    PRT: { S: { '1': 'hatte', '2': 'hattest', '3': 'hatte' }, P: { '1': 'hatten', '2': 'hattet', '3': 'hatten' } },
    KJ2: { S: { '1': 'hätte', '2': 'hättest', '3': 'hätte' }, P: { '1': 'hätten', '2': 'hättet', '3': 'hätten' } },
};
const auxSein = {
    hasPrefix: false,
    PRÄ: { S: { '1': 'bin', '2': 'bist', '3': 'ist' }, P: { '1': 'sind', '2': 'seid', '3': 'sind' } },
    PA2: ['gewesen'],
    KJ1: { S: { '1': 'sei', '2': 'seist', '3': 'sei' }, P: { '1': 'seien', '2': 'seiet', '3': 'seien' } },
    IMP: { S: 'sei', P: 'seid' },
    PA1: 'seiend',
    INF: 'sein',
    PRT: { S: { '1': 'war', '2': 'warst', '3': 'war' }, P: { '1': 'waren', '2': 'wart', '3': 'waren' } },
    KJ2: { S: { '1': 'wäre', '2': 'wärst', '3': 'wäre' }, P: { '1': 'wären', '2': 'wärt', '3': 'wären' } },
};
const auxWerden = {
    hasPrefix: false,
    PA2: ['geworden', 'worden'],
    KJ1: { S: { '1': 'werde', '2': 'werdest', '3': 'werde' }, P: { '1': 'werden', '2': 'werdet', '3': 'werden' } },
    PRÄ: { S: { '1': 'werde', '2': 'wirst', '3': 'wird' }, P: { '1': 'werden', '2': 'werdet', '3': 'werden' } },
    IMP: { S: 'werde', P: 'werdet' },
    INF: 'werden',
    PA1: 'werdend',
    PRT: { S: { '1': 'wurde', '2': 'wurdest', '3': 'wurde' }, P: { '1': 'wurden', '2': 'wurdet', '3': 'wurden' } },
    KJ2: { S: { '1': 'würde', '2': 'würdest', '3': 'würde' }, P: { '1': 'würden', '2': 'würdet', '3': 'würden' } },
};
function getVerbInfo(verbsList, verb) {
    if (verb === 'haben')
        return auxHaben;
    if (verb === 'sein')
        return auxSein;
    if (verb === 'werden')
        return auxWerden;
    if (!verb) {
        const err = new Error();
        err.name = 'TypeError';
        err.message = 'verb must not be null';
        throw err;
    }
    if (!verbsList) {
        const err = new Error();
        err.name = 'TypeError';
        err.message = 'verb list must not be null';
        throw err;
    }
    if (verbsList[verb]) {
        return verbsList[verb];
    }
    else {
        const err = new Error();
        err.name = 'NotFoundInDict';
        err.message = `${verb} not in german dict`;
        throw err;
    }
}

// exported only to ease testing
function getReflexiveFormPronoun(pronominalCase, person, number) {
    // we only care for pronominalCase for S1 or S2
    if (number === 'S' &&
        (person === 1 || person === 2) &&
        pronominalCase != 'ACCUSATIVE' &&
        pronominalCase != 'DATIVE') {
        const err = new Error();
        err.name = 'InvalidArgumentError';
        err.message = `pronominalCase ACCUSATIVE or DATIVE required for S 1 or 2`;
        throw err;
    }
    const pronouns = {
        ACCUSATIVE: {
            S: {
                1: 'mich',
                2: 'dich',
                3: 'sich',
            },
            P: {
                1: 'uns',
                2: 'euch',
                3: 'sich',
            },
        },
        DATIVE: {
            S: {
                1: 'mir',
                2: 'dir',
                3: 'sich',
            },
            P: {
                1: 'uns',
                2: 'euch',
                3: 'sich',
            },
        },
    };
    return pronouns[pronominalCase || 'ACCUSATIVE'][number][person];
}

// exported only to ease testing
function getReflexiveCase(verb) {
    const accList = [
        'abkühlen',
        'abheben',
        'amüsieren',
        'ärgern',
        'bewegen',
        'ergeben',
        'erholen',
        'freuen',
        'setzen',
        'sonnen',
        'treffen',
        'umwenden',
        'verabschieden',
        'verfahren',
    ];
    const datList = ['denken', 'kaufen', 'anziehen'];
    if (accList.includes(verb)) {
        return 'ACCUSATIVE';
    }
    else if (datList.includes(verb)) {
        return 'DATIVE';
    }
    else {
        return null;
    }
}

/* for PA2 it is better if it contains "ge", as we will use it for partizip, not for passive voice
  geworden	werden	VER:PA2:NON
  worden	werden	VER:PA2:NON

  sometimes no 'ge' form: verzeihen: verziehen verzeiht
*/
function getPartizip2(verbsList, verb) {
    const verbInfo = getVerbInfo(verbsList, verb);
    const part2list = verbInfo['PA2'];
    if (!part2list) {
        const err = new Error();
        err.name = 'NotFoundInDict';
        err.message = `no Partizip2 found for ${verb}`;
        throw err;
    }
    if (part2list.length === 1) {
        return part2list[0];
    }
    else {
        // we favor the 'ge' form hier, but it does not always exists
        for (const part2listElt of part2list) {
            if (part2listElt.includes('ge')) {
                return part2listElt;
            }
        }
        return part2list[0];
    }
}

const alwaysSein = [
    'aufwachen',
    'aufwachsen',
    'einziehen',
    'entstehen',
    'fahren',
    'fallen',
    'fliegen',
    'gehen',
    'geschehen',
    'hüpfen',
    'kommen',
    'laufen',
    'passieren',
    'reisen',
    'rennen',
    'springen',
    'steigen',
    'aussteigen',
    'einsteigen',
    'sinken',
    'sterben',
    'wachsen',
    'bleiben',
    'sein',
    'werden',
    'treten',
    'auswandern',
    'begegnen',
    'explodieren',
    'folgen',
    'landen',
    'reisen',
    'starten',
    'wandern',
    'zurückkehren',
    'verbrennen',
];
function alwaysUsesSein(verb) {
    return alwaysSein.indexOf(verb) > -1;
}

// Imperativ Präsens is not supported
const validTenses = [
    'PRASENS',
    'PRATERITUM',
    'FUTUR1',
    'PERFEKT',
    'PLUSQUAMPERFEKT',
    'FUTUR2',
    'KONJUNKTIV1_PRASENS',
    'KONJUNKTIV1_FUTUR1',
    'KONJUNKTIV1_PERFEKT',
    'KONJUNKTIV2_PRATERITUM',
    'KONJUNKTIV2_FUTUR1',
    'KONJUNKTIV2_FUTUR2',
];
function getConjugation(verbsList, verb, tense, person, number, aux, pronominal, pronominalCase) {
    // check params
    if (number != 'S' && number != 'P') {
        const err = new Error();
        err.name = 'TypeError';
        err.message = `number must be S or P, here ${number}`;
        throw err;
    }
    if (!tense || validTenses.indexOf(tense) === -1) {
        const err = new Error();
        err.name = 'TypeError';
        err.message = `tense ${tense} err, must be ${validTenses.join()}`;
        throw err;
    }
    const tensesWithAux = ['PERFEKT', 'PLUSQUAMPERFEKT', 'FUTUR2', 'KONJUNKTIV1_PERFEKT', 'KONJUNKTIV2_FUTUR2'];
    if (tensesWithAux.indexOf(tense) > -1) {
        if (!aux && alwaysUsesSein(verb)) {
            aux = 'SEIN';
        }
        if (aux != 'SEIN' && aux != 'HABEN') {
            const err = new Error();
            err.name = 'InvalidArgumentError';
            err.message = `this tense ${tense} requires aux param with SEIN or HABEN`;
            throw err;
        }
    }
    if (verb && verb.startsWith('sich ')) {
        verb = verb.replace(/^sich\s+/, '');
        pronominal = true;
    }
    // do composed tenses
    switch (tense) {
        case 'FUTUR1':
            return [
                getConjugation(verbsList, 'werden', 'PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                verb,
            ];
        case 'PERFEKT':
            return [
                getConjugation(verbsList, aux.toLowerCase(), 'PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                getPartizip2(verbsList, verb),
            ];
        case 'PLUSQUAMPERFEKT':
            return [
                getConjugation(verbsList, aux.toLowerCase(), 'PRATERITUM', person, number, undefined, pronominal, pronominalCase).join(''),
                getPartizip2(verbsList, verb),
            ];
        case 'FUTUR2':
            return [
                getConjugation(verbsList, 'werden', 'PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                `${getPartizip2(verbsList, verb)} ${aux.toLowerCase()}`,
            ];
        case 'KONJUNKTIV1_FUTUR1':
            return [
                getConjugation(verbsList, 'werden', 'KONJUNKTIV1_PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                verb,
            ];
        case 'KONJUNKTIV1_PERFEKT':
            return [
                getConjugation(verbsList, aux.toLowerCase(), 'KONJUNKTIV1_PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                getPartizip2(verbsList, verb),
            ];
        case 'KONJUNKTIV2_FUTUR1':
            return [
                getConjugation(verbsList, 'werden', 'KONJUNKTIV2_PRATERITUM', person, number, undefined, pronominal, pronominalCase).join(''),
                verb,
            ];
        case 'KONJUNKTIV2_FUTUR2':
            return [
                getConjugation(verbsList, 'werden', 'KONJUNKTIV1_PRASENS', person, number, undefined, pronominal, pronominalCase).join(''),
                `${getPartizip2(verbsList, verb)} ${aux.toLowerCase()}`,
            ];
    }
    // do all other tenses
    // get pronominal pronoun
    const pronominalPronoun = pronominal ? getReflexiveFormPronoun(pronominalCase, person, number) : null;
    if (person != 1 && person != 2 && person != 3) {
        const err = new Error();
        err.name = 'TypeError';
        err.message = 'person must 1 2 or 3';
        throw err;
    }
    const verbInfo = getVerbInfo(verbsList, verb);
    const tenseMapping = {
        PRASENS: 'PRÄ',
        PRATERITUM: 'PRT',
        KONJUNKTIV1_PRASENS: 'KJ1',
        KONJUNKTIV2_PRATERITUM: 'KJ2',
    };
    // sehen[PRÄ][SIN][1]
    const mappedTense = tenseMapping[tense];
    const verbDataTense = verbInfo[mappedTense];
    if (!verbDataTense) {
        const err = new Error();
        err.name = 'NotFoundInDict';
        err.message = `${verb} not in german dict for ${tense}`;
        throw err;
    }
    const verbDataTenseNumber = verbDataTense[number];
    if (!verbDataTenseNumber) {
        const err = new Error();
        err.name = 'NotFoundInDict';
        err.message = `${verb} not in german dict for ${tense} and ${number}`;
        throw err;
    }
    const flexForm = verbDataTenseNumber[person];
    if (!flexForm) {
        const err = new Error();
        err.name = 'NotFoundInDict';
        err.message = `${verb} not in german dict for ${tense} and ${number} and ${person}`;
        throw err;
    }
    if (!pronominalPronoun) {
        // nominal case
        if (!Array.isArray(flexForm)) {
            return [flexForm];
        }
        else {
            return flexForm; // is already an array: verb with prefix
        }
    }
    else {
        return [`${flexForm} ${pronominalPronoun}`];
    }
}


return {getVerbInfo, getPartizip2, alwaysUsesSein, getConjugation};
})();</script>
<script>
(function(){
  "use strict";

  var sampleVerben = null, sampleSubstantive = null, sampleAdjektive = null;

  async function loadJson(url){
    var resp = await fetch(url);
    if (!resp.ok) throw new Error(url+" responded with "+resp.status);
    return resp.json();
  }
  async function loadGzipJson(url){
    var resp = await fetch(url);
    if (!resp.ok) throw new Error(url+" responded with "+resp.status);
    var ds = resp.body.pipeThrough(new DecompressionStream('gzip'));
    var text = await new Response(ds).text();
    return JSON.parse(text);
  }

  var VERB_DICT = null, NOUN_DICT = null;

  function escapeHtml(s){ var d=document.createElement("div"); d.textContent=s; return d.innerHTML; }
  function normalize(s){ return (s||"").trim().toLowerCase().replace(/ß/g,"ss").replace(/\s+/g," "); }
  var MISTAKES_KEY = "deutsch_ueben_mistakes";
  function loadMistakes(){ try{ var r=localStorage.getItem(MISTAKES_KEY); return r?JSON.parse(r):[]; }catch(e){ return []; } }
  function saveMistakes(m){ try{ localStorage.setItem(MISTAKES_KEY, JSON.stringify(m)); }catch(e){} }
  function loadStored(key){ try{ var r=localStorage.getItem(key); return r?JSON.parse(r):null; }catch(e){ return null; } }
  function saveStored(key,v){ try{ localStorage.setItem(key, JSON.stringify(v)); }catch(e){} }

  var score = {right:0,total:0};
  function updateScore(){ document.getElementById("scorePill").textContent = score.right+" / "+score.total; }

  function addMistake(entry){
    var list = loadMistakes();
    entry.id = Date.now().toString(36)+Math.random().toString(36).slice(2);
    entry.status = "new";
    list.unshift(entry);
    if (list.length>300) list = list.slice(0,300);
    saveMistakes(list); renderMistakes();
    return entry.id;
  }
  /* correct reattempt: new -> reviewed, reviewed -> removed. returns nothing */
  function promoteMistake(id){
    var list = loadMistakes();
    var idx = list.findIndex(function(m){ return m.id===id; });
    if (idx===-1) return;
    if (list[idx].status==="new"){ list[idx].status="reviewed"; }
    else { list.splice(idx,1); }
    saveMistakes(list); renderMistakes();
  }
  function touchMistake(id, given){
    var list = loadMistakes();
    var idx = list.findIndex(function(m){ return m.id===id; });
    if (idx===-1) return;
    list[idx].given = given;
    saveMistakes(list); renderMistakes();
  }
  /* rolls each mistake of the given type independently (new: 1/10, reviewed: 1/20); returns one triggered entry or null */
  function pickMistakeCandidate(type){
    var pool = loadMistakes().filter(function(m){ return m.type===type; });
    var candidates = [];
    pool.forEach(function(m){
      var p = m.status==="new" ? 0.1 : 0.05;
      if (Math.random() < p) candidates.push(m);
    });
    return candidates.length ? candidates[Math.floor(Math.random()*candidates.length)] : null;
  }
  var GENDER_LABEL = {m:"Mask.", f:"Fem.", n:"Neutr."};
  function renderMistakes(){
    var list = loadMistakes();
    var box = document.getElementById("mistakesList"), empty = document.getElementById("mistakesEmpty"), clearBtn = document.getElementById("clearMistakes");
    box.innerHTML = "";
    if (!list.length){ empty.classList.remove("d-none"); clearBtn.classList.add("d-none"); return; }
    empty.classList.add("d-none"); clearBtn.classList.remove("d-none");
    list.forEach(function(m){
      var row = document.createElement("div");
      row.className = "mistakes-row d-flex justify-content-between align-items-start " + m.status;
      var extraTags = "", detailText = "";
      if (m.type === "adj"){
        var caseTag = m.caseKey ? ' <span class="tag tag-case-'+m.caseKey+'">'+CASE_LABEL[m.caseKey]+'</span>' : '';
        var genderPluralTag = '';
        if (m.gender){
          genderPluralTag = m.isPlural
            ? ' <span class="tag tag-num-pl">'+GENDER_LABEL[m.gender]+' Pl.</span>'
            : ' <span class="tag tag-gender-'+m.gender+'">'+GENDER_LABEL[m.gender]+'</span>';
        }
        extraTags = caseTag + genderPluralTag;
        detailText = m.phrase ? ' <span class="muted small">('+escapeHtml(m.phrase)+')</span>' : '';
      } else {
        extraTags = ' <span class="tag tag-tense-'+m.tense+'">'+m.tense+'</span> <span class="pronoun">'+PRONOUN_LABEL[m.pronoun]+'</span>';
        detailText = ' <span class="muted small">(to '+escapeHtml(m.meaning)+')</span>';
      }
      row.innerHTML = '<div><div>'+escapeHtml(m.headline)+extraTags+detailText+'</div>'+
        '<div class="small">you wrote: <span class="feedback-bad">'+escapeHtml(m.given||"—")+'</span> · correct: <span class="feedback-ok">'+escapeHtml(m.expected)+'</span></div></div>';
      box.appendChild(row);
    });
  }
  document.getElementById("clearMistakes").addEventListener("click", function(){
    saveMistakes([]); renderMistakes();
    score.right=0; score.total=0; updateScore();
  });

  /* ========================= VERBS ========================= */
  var verben = null;
  var validInfs = [], missingInfs = [];
  var PRONOUNS = [["ich",1,"S"],["du",2,"S"],["er",3,"S"],["wir",1,"P"],["ihr",2,"P"],["sie",3,"P"]];
  var PRONOUN_LABEL = {ich:"ich",du:"du",er:"er/sie/es",wir:"wir",ihr:"ihr",sie:"sie/Sie"};
  var TENSE_CODE = {present:"PRASENS", past:"PRATERITUM", perfect:"PERFEKT"};
  var TENSES_ALL = ["present","past","perfect"];
  var currentVerb = null;

  function selectedTenses(){
    var vals = Array.prototype.slice.call(document.querySelectorAll(".tense-check:checked")).map(function(c){return c.value;});
    return vals.length ? vals : TENSES_ALL;
  }

  function rebuildVerbIndex(){
    validInfs = []; missingInfs = [];
    Object.keys(verben).forEach(function(inf){
      if (verbIsUsable(inf)) validInfs.push(inf); else missingInfs.push(inf);
    });
    document.getElementById("verbCount").textContent = "Practicing " + Object.keys(verben).length + " verbs.";
    document.getElementById("verbMissingNote").textContent = missingInfs.length ? ("Not found in verbs-db (skipped): " + missingInfs.join(", ")) : "";
  }

  /* parses one comma-separated meaning entry. Supports, in any order/combination:
       <sich>   - reflexive sense (adds the matching reflexive pronoun)
       <insep>  - force inseparable-prefix conjugation, even if the dictionary only has the separable variant
       <sep>    - force separable-prefix conjugation, even if the dictionary only has the inseparable variant
       <sein>   - force "sein" as the perfect-tense auxiliary for this sense
       <haben>  - force "haben" as the perfect-tense auxiliary for this sense
       [xxx]    - governed preposition, shown as a hint (not required in the typed answer)
     e.g. "<sich>[an] look forward to", "<insep> [mit] deal with", "<sein> move" */
  function parseMeaningChunk(raw){
    var s = raw.trim();
    var reflexive=false, sepOverride=null, auxOverride=null, preposition=null;
    var re = /^(?:<(sich|insep|sep|sein|haben)>|\[([^\]]+)\])\s*/i;
    var m;
    while ((m = re.exec(s))){
      if (m[1]){
        var tag = m[1].toLowerCase();
        if (tag==="sich") reflexive = true;
        else if (tag==="insep") sepOverride = false;
        else if (tag==="sep") sepOverride = true;
        else if (tag==="sein") auxOverride = "SEIN";
        else if (tag==="haben") auxOverride = "HABEN";
      } else if (m[2]!==undefined){
        preposition = m[2].trim();
      }
      s = s.slice(m[0].length);
    }
    return { reflexive:reflexive, sepOverride:sepOverride, auxOverride:auxOverride, preposition:preposition, text: s.trim() };
  }

  /* known separable + inseparable + "duale" (either) prefixes, longest first so e.g. "zusammen" wins over "zu" */
  var PREFIX_CANDIDATES = ["zurück","zusammen","herbei","hinauf","hinunter","hinein","heraus","empor",
    "ab","an","auf","aus","bei","ein","mit","nach","vor","weg","zu","her","hin","los","fest",
    "durch","über","um","unter","wieder","wider","voll","hinter",
    "be","ge","er","ver","zer","ent","emp","miss"].sort(function(a,b){ return b.length-a.length; });
  /* finds {prefix, base} such that base is itself a known dictionary verb — used to reconstruct
     whichever separable/inseparable variant the dictionary doesn't natively store */
  function splitVerbPrefix(inf){
    for (var i=0;i<PREFIX_CANDIDATES.length;i++){
      var p = PREFIX_CANDIDATES[i];
      if (inf.indexOf(p)===0 && inf.length > p.length+1){
        var rest = inf.slice(p.length);
        try{ GV.getVerbInfo(VERB_DICT, rest); return {prefix:p, base:rest}; }catch(e){}
      }
    }
    return null;
  }
  function verbIsUsable(inf){
    try{ GV.getVerbInfo(VERB_DICT, inf); return true; }catch(e){}
    return !!splitVerbPrefix(inf);
  }

  var REFLEXIVE_PRONOUN = {ich:"mich",du:"dich",er:"sich",wir:"uns",ihr:"euch",sie:"sich"};

  /* builds the expected answer for one round, honoring <insep>/<sep> and <sein>/<haben> overrides.
     When a sep/insep override is given, the verb is reconstructed from its base verb + prefix
     rather than looked up directly, since the dictionary only ever stores one variant per spelling. */
  function buildVerbExpected(inf, tenseKey, p, tags){
    var tenseCode = TENSE_CODE[tenseKey];
    var person = p[1], number = p[2];
    var rawArr = null;

    if (tags.sepOverride !== null){
      var split = splitVerbPrefix(inf);
      if (split){
        if (tenseCode === "PERFEKT"){
          var aux = tags.auxOverride || "HABEN";
          var auxForm = GV.getConjugation(VERB_DICT, aux.toLowerCase(), "PRASENS", person, number)[0];
          var basePA2 = GV.getPartizip2(VERB_DICT, split.base);
          var participle = tags.sepOverride ? (split.prefix + basePA2) : (split.prefix + basePA2.replace(/^ge/, ""));
          rawArr = [auxForm, participle];
        } else {
          var baseForm = GV.getConjugation(VERB_DICT, split.base, tenseCode, person, number)[0];
          rawArr = tags.sepOverride ? [baseForm, split.prefix] : [split.prefix + baseForm];
        }
      }
    }

    if (!rawArr){
      try{
        if (tenseCode === "PERFEKT"){
          var aux2 = tags.auxOverride || (GV.alwaysUsesSein(inf) ? "SEIN":"HABEN");
          rawArr = GV.getConjugation(VERB_DICT, inf, "PERFEKT", person, number, aux2);
        } else {
          rawArr = GV.getConjugation(VERB_DICT, inf, tenseCode, person, number);
        }
      } catch(e){
        // last resort: inf isn't a direct dictionary entry (only reachable via prefix-splitting) —
        // fall back to a separable reconstruction so the round doesn't crash
        var fb = splitVerbPrefix(inf);
        if (!fb) throw e;
        if (tenseCode === "PERFEKT"){
          var aux3 = tags.auxOverride || "HABEN";
          var auxForm3 = GV.getConjugation(VERB_DICT, aux3.toLowerCase(), "PRASENS", person, number)[0];
          rawArr = [auxForm3, fb.prefix + GV.getPartizip2(VERB_DICT, fb.base)];
        } else {
          rawArr = [GV.getConjugation(VERB_DICT, fb.base, tenseCode, person, number)[0], fb.prefix];
        }
      }
    }

    var extras = [];
    if (tags.reflexive) extras.push(REFLEXIVE_PRONOUN[p[0]]);
    if (tags.preposition) extras.push(tags.preposition);
    if (extras.length){
      rawArr = [rawArr[0]].concat(extras).concat(rawArr.slice(1));
    }
    return rawArr.join(" ");
  }

  function pickVerbRound(){
    if (!validInfs.length){ document.getElementById("meaningText").textContent = "No verbs available — load a verben.json."; return; }
    var replay = pickMistakeCandidate("verb");
    var inf, meaning, tense, pronounKey, expected, mistakeId, reflexive, preposition, sepOverride, auxOverride;
    if (replay){
      inf=replay.inf; meaning=replay.meaning; tense=replay.tense; pronounKey=replay.pronoun; expected=replay.expected; mistakeId=replay.id;
      reflexive=replay.reflexive; preposition=replay.preposition; sepOverride=replay.sepOverride; auxOverride=replay.auxOverride;
    } else {
      var pool = selectedTenses();
      inf = validInfs[Math.floor(Math.random()*validInfs.length)];
      var meaningList = verben[inf].split(",");
      var chunk = parseMeaningChunk(meaningList[Math.floor(Math.random()*meaningList.length)]);
      meaning = chunk.text; reflexive = chunk.reflexive; preposition = chunk.preposition;
      sepOverride = chunk.sepOverride; auxOverride = chunk.auxOverride;
      tense = pool[Math.floor(Math.random()*pool.length)];
      var p = PRONOUNS[Math.floor(Math.random()*6)];
      pronounKey = p[0];
      expected = buildVerbExpected(inf, tense, p, chunk);
      mistakeId = null;
    }
    currentVerb = {inf:inf, meaning:meaning, tense:tense, pronoun:pronounKey, expected:expected, mistakeId:mistakeId,
      reflexive:reflexive, preposition:preposition, sepOverride:sepOverride, auxOverride:auxOverride};
    document.getElementById("meaningText").textContent = "to " + meaning;
    var tTag = document.getElementById("tenseTag");
    tTag.textContent = tense; tTag.className = "tag tag-tense-"+tense;
    document.getElementById("pronounTag").textContent = PRONOUN_LABEL[pronounKey];
    var prepTag = document.getElementById("prepTag");
    if (preposition) prepTag.classList.remove("d-none"); else prepTag.classList.add("d-none");
    document.getElementById("answerInput").value = "";
    document.getElementById("feedback").classList.add("d-none");
    document.getElementById("answerInput").focus();
  }
  function submitVerbAnswer(){
    if (!currentVerb) return;
    var val = document.getElementById("answerInput").value;
    var ok = normalize(val)===normalize(currentVerb.expected);
    score.total++; if(ok) score.right++; updateScore();
    var fb = document.getElementById("feedback");
    fb.classList.remove("d-none","ok","bad"); fb.classList.add(ok?"ok":"bad");
    fb.innerHTML = ok ? '<span class="feedback-ok">Correct.</span> '+escapeHtml(currentVerb.expected) : '<span class="feedback-bad">Not quite.</span> Correct: '+escapeHtml(currentVerb.expected);
    if (currentVerb.mistakeId){
      if (ok) promoteMistake(currentVerb.mistakeId); else touchMistake(currentVerb.mistakeId, val);
    } else if (!ok){
      addMistake({type:"verb", headline:currentVerb.inf, detail:currentVerb.meaning+", "+currentVerb.tense+", "+PRONOUN_LABEL[currentVerb.pronoun], given:val, expected:currentVerb.expected,
        inf:currentVerb.inf, meaning:currentVerb.meaning, tense:currentVerb.tense, pronoun:currentVerb.pronoun,
        reflexive:currentVerb.reflexive, preposition:currentVerb.preposition, sepOverride:currentVerb.sepOverride, auxOverride:currentVerb.auxOverride});
    }
    setTimeout(pickVerbRound, ok?900:3600);
  }
  document.getElementById("answerForm").addEventListener("submit", function(e){ e.preventDefault(); submitVerbAnswer(); });
  document.getElementById("checkBtn").addEventListener("click", submitVerbAnswer);
  document.getElementById("skipBtn").addEventListener("click", pickVerbRound);
  document.querySelectorAll(".tense-check").forEach(function(c){ c.addEventListener("change", pickVerbRound); });
  document.getElementById("verbFile").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){
      try{ verben = JSON.parse(ev.target.result); saveStored("dv_verben", verben); rebuildVerbIndex(); pickVerbRound(); }
      catch(err){ alert("Couldn't parse verben.json: "+err.message); }
    };
    reader.readAsText(file);
  });

  /* ========================= ADJECTIVES & NOUNS ========================= */
  var substantive = null;
  var adjektive = null;
  var validNouns = [], missingNouns = [];

  var CASES_ALL = ["N","G","D","A"];
  var CASE_LABEL = {N:"N – 1",G:"G – 2",D:"D – 3",A:"A – 4"};
  var CASE_GLOSS = {N:"",A:"",G:"of ",D:"to "};
  var STRONG = {m:{N:"er",G:"en",D:"em",A:"en"}, f:{N:"e",G:"er",D:"er",A:"e"}, n:{N:"es",G:"en",D:"em",A:"es"}, pl:{N:"e",G:"er",D:"en",A:"e"}};
  var WEAK   = {m:{N:"e", G:"en",D:"en",A:"en"}, f:{N:"e",G:"en",D:"en",A:"e"}, n:{N:"e", G:"en",D:"en",A:"e"}, pl:{N:"en",G:"en",D:"en",A:"en"}};
  var MIXED  = {m:{N:"er",G:"en",D:"en",A:"en"}, f:{N:"e",G:"en",D:"en",A:"e"}, n:{N:"es",G:"en",D:"en",A:"es"}, pl:{N:"en",G:"en",D:"en",A:"en"}};
  var DET_ENDINGS = {m:{N:"er",G:"es",D:"em",A:"en"}, f:{N:"e",G:"er",D:"er",A:"e"}, n:{N:"es",G:"es",D:"em",A:"es"}, pl:{N:"e",G:"er",D:"en",A:"e"}};
  var DEFINITE_TABLE = { m:{N:"der",G:"des",D:"dem",A:"den"}, f:{N:"die",G:"der",D:"der",A:"die"}, n:{N:"das",G:"des",D:"dem",A:"das"}, pl:{N:"die",G:"der",D:"den",A:"die"} };
  var DER_WORDS = [ {name:"der",irregular:true,gloss:{sg:"the",pl:"the"}}, {name:"dieser",stem:"dies",gloss:{sg:"this",pl:"these"}},
    {name:"jeder",stem:"jed",singularOnly:true,gloss:{sg:"every",pl:"every"}}, {name:"welcher",stem:"welch",gloss:{sg:"which",pl:"which"}}, {name:"mancher",stem:"manch",gloss:{sg:"many a",pl:"some"}}, {name:"alle",stem:"all",pluralOnly:true,gloss:{sg:"all",pl:"all"}} ];
  var EIN_WORDS = [ {name:"ein",stem:"ein",singularOnly:true,gloss:{sg:"a",pl:""}}, {name:"kein",stem:"kein",gloss:{sg:"no",pl:"no"}},
    {name:"mein",stem:"mein",gloss:{sg:"my",pl:"my"}}, {name:"dein",stem:"dein",gloss:{sg:"your",pl:"your"}}, {name:"sein",stem:"sein",gloss:{sg:"his",pl:"his"}},
    {name:"ihr",stem:"ihr",gloss:{sg:"her",pl:"her"}}, {name:"unser",stem:"unser",gloss:{sg:"our",pl:"our"}}, {name:"euer",stem:"eur",gloss:{sg:"your",pl:"your"}},
    {name:"Ihr",stem:"Ihr",gloss:{sg:"Your",pl:"Your"}} ];

  /* parses leading <...> tag(s) on a noun meaning chunk, e.g. "<Fem> teacher" -> {tags:["Fem"], text:"teacher"}.
     Purely a display hint — has no effect on grammar/answer checking. */
  function parseNounMeaningChunk(raw){
    var s = raw.trim();
    var tags = [];
    var re = /^<([^>]+)>\s*/;
    var m;
    while ((m = re.exec(s))){
      tags.push(m[1].trim());
      s = s.slice(m[0].length);
    }
    return { tags: tags, text: s.trim() };
  }
  function selectedCases(){
    var vals = Array.prototype.slice.call(document.querySelectorAll(".case-check:checked")).map(function(c){return c.value;});
    return vals.length ? vals : CASES_ALL;
  }

  function detForm(entry, gender, caseKey, isEin){
    if (entry.irregular) return DEFINITE_TABLE[gender][caseKey];
    var ending = DET_ENDINGS[gender][caseKey];
    if (isEin){ if(gender==="m"&&caseKey==="N") ending=""; if(gender==="n"&&(caseKey==="N"||caseKey==="A")) ending=""; }
    return ending==="" ? entry.name : entry.stem+ending;
  }
  function pickDeterminer(numberKey){
    var cat = ["none","der","ein"][Math.floor(Math.random()*3)];
    if (cat==="none") return {cat:"none"};
    var pool = (cat==="der"?DER_WORDS:EIN_WORDS).filter(function(e){ return numberKey==="pl" ? !e.singularOnly : !e.pluralOnly; });
    return {cat:cat, entry: pool[Math.floor(Math.random()*pool.length)]};
  }
  function adjectiveEnding(cat, gender, caseKey){ return (cat==="der"?WEAK:cat==="ein"?MIXED:STRONG)[gender][caseKey]; }
  /* adjectives whose dictionary key ends in "-" (e.g. "besonder-", "mittler-") keep their
     full stem as-is when an ending is added — besondere/besonderen, mittlere/mittleren —
     instead of going through the usual -er/-el e-drop contraction. */
  function adjectiveStemBase(adj){
    if (adj.slice(-1)==="-") return adj.slice(0,-1);
    if (adj==="hoch") return "hoh";
    if (/el$/.test(adj)) return adj.slice(0,-2)+"l";
    if (/er$/.test(adj)) return adj.slice(0,-2)+"r";
    return adj;
  }
  function pluralizeEn(w){
    if (/[^aeiou]y$/i.test(w)) return w.slice(0,-1)+"ies";
    if (/(s|x|z|ch|sh)$/i.test(w)) return w+"es";
    return w+"s";
  }
  function articleFor(base, nextWord){ if (base!=="a") return base; return /^[aeiouAEIOU]/.test(nextWord) ? "an" : "a"; }
  function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

  function lookupNoun(word){
    var arr = NOUN_DICT[word];
    if (!arr) return null;
    return { gender:arr[0], forms:{ N:{sg:arr[1],pl:arr[2]}, G:{sg:arr[3],pl:arr[4]}, D:{sg:arr[5],pl:arr[6]}, A:{sg:arr[7],pl:arr[8]} } };
  }
  function rebuildNounIndex(){
    validNouns = []; missingNouns = [];
    Object.keys(substantive).forEach(function(w){ if (lookupNoun(w)) validNouns.push(w); else missingNouns.push(w); });
    document.getElementById("nounCount").textContent = "Practicing " + Object.keys(substantive).length + " nouns × " + Object.keys(adjektive).length + " adjectives.";
    document.getElementById("nounMissingNote").textContent = missingNouns.length ? ("Not found in nouns-db (skipped): " + missingNouns.join(", ")) : "";
  }

  var currentAdj = null;
  function pickAdjRound(){
    if (!validNouns.length){ document.getElementById("phraseText").textContent = "No nouns available — load a substantive.json."; return; }
    var replay = pickMistakeCandidate("adj");
    var nounWord, adj, caseKey, isPlural, expected, phrase, mistakeId, gender, nounHint;
    if (replay){
      nounWord=replay.nounWord; adj=replay.adjWord; caseKey=replay.caseKey; isPlural=replay.isPlural; expected=replay.expected; phrase=replay.phrase; mistakeId=replay.id; gender=replay.gender;
      nounHint = replay.nounHint;
    } else {
      var casePool = selectedCases();
      var adjKeys = Object.keys(adjektive);
      nounWord = validNouns[Math.floor(Math.random()*validNouns.length)];
      var nEntry = lookupNoun(nounWord);
      gender = nEntry.gender;
      isPlural = Math.random() < 0.25;
      var numberKey = isPlural ? "pl" : "sg";
      var genderKey = isPlural ? "pl" : nEntry.gender;
      caseKey = casePool[Math.floor(Math.random()*casePool.length)];
      adj = adjKeys[Math.floor(Math.random()*adjKeys.length)];
      var det = pickDeterminer(numberKey);

      var nounForm = nEntry.forms[caseKey][numberKey] || nEntry.forms[caseKey].sg;
      var correctEnding = adjectiveEnding(det.cat, genderKey, caseKey);
      var adjForm = adjectiveStemBase(adj) + correctEnding;
      var detDisplay = det.cat==="none" ? null : detForm(det.entry, genderKey, caseKey, det.cat==="ein");
      expected = (detDisplay ? detDisplay+" " : "") + adjForm + " " + nounForm;

      var adjEnList = adjektive[adj].split(","); var adjEn = adjEnList[Math.floor(Math.random()*adjEnList.length)].trim();
      var nounEnList = substantive[nounWord].split(",");
      var nounChunk = parseNounMeaningChunk(nounEnList[Math.floor(Math.random()*nounEnList.length)]);
      var nounEn = nounChunk.text;
      nounHint = nounChunk.tags.length ? nounChunk.tags.join(", ") : null;
      if (isPlural) nounEn = pluralizeEn(nounEn);
      var detGlossWord = det.cat==="none" ? "" : det.entry.gloss[numberKey];
      detGlossWord = articleFor(detGlossWord, adjEn);
      phrase = CASE_GLOSS[caseKey] + (detGlossWord?detGlossWord+" ":"") + adjEn + " " + nounEn;
      mistakeId = null;
    }

    currentAdj = {nounWord:nounWord, adj:adj, caseKey:caseKey, isPlural:isPlural, expected:expected, phrase:phrase, mistakeId:mistakeId, gender:gender, nounHint:nounHint};
    var cTag = document.getElementById("caseTag");
    cTag.textContent = CASE_LABEL[caseKey]; cTag.className = "tag tag-case-"+caseKey;
    var nTag = document.getElementById("numberTag");
    nTag.textContent = isPlural?"plural":"singular"; nTag.className = "tag " + (isPlural?"tag-num-pl":"tag-num-sg");
    var hintTag = document.getElementById("nounHintTag");
    if (nounHint){ hintTag.textContent = nounHint; hintTag.classList.remove("d-none"); }
    else { hintTag.classList.add("d-none"); }
    document.getElementById("phraseText").textContent = phrase;
    document.getElementById("adjInput").value = "";
    document.getElementById("adjFeedback").classList.add("d-none");
    document.getElementById("adjInput").focus();
  }
  function submitAdjAnswer(){
    if (!currentAdj) return;
    var val = document.getElementById("adjInput").value;
    var ok = normalize(val)===normalize(currentAdj.expected);
    score.total++; if(ok) score.right++; updateScore();
    var fb = document.getElementById("adjFeedback");
    fb.classList.remove("d-none","ok","bad"); fb.classList.add(ok?"ok":"bad");
    fb.innerHTML = ok ? '<span class="feedback-ok">Correct.</span> '+escapeHtml(currentAdj.expected) : '<span class="feedback-bad">Not quite.</span> Correct: '+escapeHtml(currentAdj.expected);
    if (currentAdj.mistakeId){
      if (ok) promoteMistake(currentAdj.mistakeId); else touchMistake(currentAdj.mistakeId, val);
    } else if (!ok){
      addMistake({type:"adj", headline:currentAdj.adj.replace(/-$/,"")+" + "+currentAdj.nounWord, detail:CASE_LABEL[currentAdj.caseKey]+", "+(currentAdj.isPlural?"plural":"singular"), given:val, expected:currentAdj.expected,
        nounWord:currentAdj.nounWord, adjWord:currentAdj.adj, caseKey:currentAdj.caseKey, isPlural:currentAdj.isPlural, phrase:currentAdj.phrase, gender:currentAdj.gender, nounHint:currentAdj.nounHint});
    }
    setTimeout(pickAdjRound, ok?900:3600);
  }
  document.getElementById("adjForm").addEventListener("submit", function(e){ e.preventDefault(); submitAdjAnswer(); });
  document.getElementById("adjCheckBtn").addEventListener("click", submitAdjAnswer);
  document.getElementById("adjSkipBtn").addEventListener("click", pickAdjRound);
  document.querySelectorAll(".case-check").forEach(function(c){ c.addEventListener("change", pickAdjRound); });
  document.getElementById("nounFile").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){ try{ substantive = JSON.parse(ev.target.result); saveStored("dv_substantive", substantive); rebuildNounIndex(); pickAdjRound(); } catch(err){ alert("Couldn't parse substantive.json: "+err.message); } };
    reader.readAsText(file);
  });
  document.getElementById("adjFile").addEventListener("change", function(e){
    var file = e.target.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(ev){ try{ adjektive = JSON.parse(ev.target.result); saveStored("dv_adjektive", adjektive); pickAdjRound(); } catch(err){ alert("Couldn't parse adjektive.json: "+err.message); } };
    reader.readAsText(file);
  });

  /* ========================= INIT ========================= */
  async function init(){
    try{
      document.getElementById("loadingText").textContent = "Loading verbs-db (~8,400 verbs)…";
      VERB_DICT = await loadGzipJson("verbs-db");
      document.getElementById("loadingText").textContent = "Loading nouns-db (~88,500 nouns)…";
      NOUN_DICT = await loadGzipJson("nouns-db");
      document.getElementById("loadingText").textContent = "Loading sample word lists…";
      sampleVerben = await loadJson("verben-sample.json");
      sampleSubstantive = await loadJson("substantive-sample.json");
      sampleAdjektive = await loadJson("adjektive-sample.json");
      verben = loadStored("dv_verben") || sampleVerben;
      substantive = loadStored("dv_substantive") || sampleSubstantive;
      adjektive = loadStored("dv_adjektive") || sampleAdjektive;
    } catch(e){
      document.getElementById("loadingText").innerHTML =
        "Couldn't load one of the required files.<br>Make sure <code>verbs-db</code>, <code>nouns-db</code>, <code>verben-sample.json</code>, " +
        "<code>adjektive-sample.json</code> and <code>substantive-sample.json</code> all sit in the same folder as this HTML file.<br>" +
        "If you opened this file directly (double-click / file://), your browser may block local file requests — " +
        "try running a tiny local server instead, e.g. from a terminal in that folder:<br><code>python3 -m http.server</code><br>" +
        "then open <code>http://localhost:8000/</code> in your browser.<br><br><span class='muted'>"+escapeHtml(e.message)+"</span>";
      return;
    }
    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("appRoot").style.display = "";
    rebuildVerbIndex(); rebuildNounIndex();
    updateScore(); renderMistakes(); pickVerbRound(); pickAdjRound();
  }
  init();
})();
</script>
</body>
</html>
